type: vertical-stack
cards:
  - type: map
    title: Mapa del paseo
    entities:
      - entity: device_tracker.don_abrikos_location
    hours_to_show: 12
    dark_mode: false

  - type: entities
    title: Ruta del paseo
    show_header_toggle: false
    entities:
      - entity: device_tracker.don_abrikos_location
      - entity: sensor.don_abrikos_walk_distance
      - entity: sensor.don_abrikos_current_zone
      - entity: sensor.don_abrikos_current_room

  - type: markdown
    title: Notas
    content: |
      DIVA publica `device_tracker.don_abrikos_location` desde el historial GPS de la mascota.

      Atributos útiles en `sensor.don_abrikos_walk_distance`:
      - `current_route_line`
      - `last_route_line`
      - `current_route_geojson`
      - `last_route_geojson`
