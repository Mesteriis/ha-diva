title: DIVA Editor Workbench
views:
  - title: Workbench
    path: workbench
    icon: mdi:toolbox-outline
    cards:
      - type: markdown
        title: DIVA UI Workbench
        content: |
          This view uses the helper + script package from `examples/ui_workbench_package.yaml`.

          Use it for:

          - vaccine completion, reschedule, cancel
          - medication dose logging
          - vet and operations report export
          - calendar sync trigger

      - type: entities
        title: Shared Context
        entities:
          - entity: input_text.diva_ui_pet_id
          - entity: input_text.diva_ui_actor
          - entity: input_text.diva_ui_note
          - entity: input_select.diva_ui_report_format
          - entity: input_number.diva_ui_report_history_days

      - type: grid
        title: Vaccine Editor
        square: false
        columns: 2
        cards:
          - type: entities
            title: Vaccine Inputs
            entities:
              - entity: input_text.diva_ui_vaccine_dose_id
              - entity: input_text.diva_ui_vaccine_name
              - entity: input_datetime.diva_ui_vaccine_due_date
          - type: grid
            title: Vaccine Actions
            square: false
            columns: 3
            cards:
              - type: button
                entity: script.diva_ui_complete_vaccine
                name: Complete
              - type: button
                entity: script.diva_ui_reschedule_vaccine
                name: Reschedule
              - type: button
                entity: script.diva_ui_cancel_vaccine
                name: Cancel

      - type: grid
        title: Medication Editor
        square: false
        columns: 2
        cards:
          - type: entities
            title: Medication Inputs
            entities:
              - entity: input_text.diva_ui_medication_name
              - entity: input_text.diva_ui_medication_dose
          - type: button
            entity: script.diva_ui_log_medication_dose
            name: Log medication dose

      - type: grid
        title: Report Export
        square: false
        columns: 3
        cards:
          - type: button
            entity: script.diva_ui_generate_vet_report
            name: Export vet report
          - type: button
            entity: script.diva_ui_generate_operations_report
            name: Export operations report
          - type: button
            entity: script.diva_ui_sync_calendar
            name: Sync calendar

      - type: entities
        title: Live Status
        entities:
          - entity: sensor.don_abrikos_next_vaccine
          - entity: sensor.don_abrikos_vaccine_status
          - entity: sensor.don_abrikos_active_medications
          - entity: sensor.don_abrikos_generated_reports
          - entity: sensor.don_abrikos_calendar_sync
          - entity: sensor.don_abrikos_calendar_conflicts
