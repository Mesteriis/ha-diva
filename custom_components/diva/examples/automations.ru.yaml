- alias: "DIVA -> Herald: рекомендации по питомцу"
  trigger:
    - platform: event
      event_type: diva_recommendation
  action:
    - action: herald.notify
      data:
        title: "Рекомендация по питомцу"
        message: "{{ trigger.event.data.pet_name }}: {{ trigger.event.data.recommendation }}"
        level: warning

- alias: "DIVA -> Low food intake"
  trigger:
    - platform: event
      event_type: diva_anomaly
      event_data:
        type: low_food_intake
  action:
    - action: persistent_notification.create
      data:
        title: "Аномалия DIVA"
        message: "{{ trigger.event.data.pet_name }}: низкое потребление корма ({{ trigger.event.data.severity }})."

- alias: "DIVA -> Напоминание о воде"
  trigger:
    - platform: event
      event_type: diva_event
      event_data:
        event: water_empty
  action:
    - action: script.notify_family
      data:
        message: "{{ trigger.event.data.pet_name }}: нужно долить свежую воду."

- alias: "DIVA -> Routine due -> Herald"
  trigger:
    - platform: event
      event_type: diva_event
      event_data:
        event: routine_due
  action:
    - action: herald.notify
      data:
        title: "Распорядок питомца"
        message: "{{ trigger.event.data.pet_name }}: {{ trigger.event.data.summary }} в {{ trigger.event.data.scheduled_for }}"
        level: info

- alias: "DIVA -> Ежедневная синхронизация календаря"
  trigger:
    - platform: time
      at: "04:00:00"
  action:
    - action: diva.sync_calendar
      data:
        pet_id: don_abrikos_a1b2c3
        days: 14
