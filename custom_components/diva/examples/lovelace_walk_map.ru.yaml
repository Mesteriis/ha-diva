type: vertical-stack
cards:
  - type: map
    title: Карта прогулки
    entities:
      - entity: device_tracker.don_abrikos_location
    hours_to_show: 12
    dark_mode: false

  - type: entities
    title: Маршрут прогулки
    show_header_toggle: false
    entities:
      - entity: device_tracker.don_abrikos_location
      - entity: sensor.don_abrikos_walk_distance
      - entity: sensor.don_abrikos_current_zone
      - entity: sensor.don_abrikos_current_room

  - type: markdown
    title: Заметки
    content: |
      DIVA публикует `device_tracker.don_abrikos_location` из истории GPS питомца.

      Полезные атрибуты у `sensor.don_abrikos_walk_distance`:
      - `current_route_line`
      - `last_route_line`
      - `current_route_geojson`
      - `last_route_geojson`
