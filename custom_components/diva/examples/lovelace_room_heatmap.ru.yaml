type: vertical-stack
cards:
  - type: entities
    title: Тепловая карта комнат
    show_header_toggle: false
    entities:
      - entity: sensor.don_abrikos_current_room
      - entity: sensor.don_abrikos_room_heatmap

  - type: markdown
    title: Сегодня
    content: |
      {% set rows = state_attr('sensor.don_abrikos_room_heatmap', 'today_rows') or [] %}
      | Комната | Время | Доля | Heat |
      |---|---:|---:|:---:|
      {% for row in rows %}
      | {{ row.room_name }} | {{ row.minutes }} мин | {{ row.share_pct }}% | {{ row.blocks }} |
      {% endfor %}

  - type: markdown
    title: Последние 7 дней
    content: |
      {% set rows = state_attr('sensor.don_abrikos_room_heatmap', 'week_rows') or [] %}
      | Комната | Время | Доля | Heat |
      |---|---:|---:|:---:|
      {% for row in rows %}
      | {{ row.room_name }} | {{ row.hours }} ч | {{ row.share_pct }}% | {{ row.blocks }} |
      {% endfor %}
