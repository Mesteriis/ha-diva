name: validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/diva/manifest.json >/dev/null
          python -m json.tool custom_components/diva/strings.json >/dev/null
          python -m json.tool custom_components/diva/translations/en.json >/dev/null
          python -m json.tool custom_components/diva/translations/ru.json >/dev/null
          python -m json.tool custom_components/diva/translations/es.json >/dev/null
      - name: Validate HACS metadata
        uses: hacs/action@main
        with:
          category: integration
