name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio ruff voluptuous aiohttp PyYAML Jinja2 'numpy>=1.26.0' Pillow
      - name: Python syntax
        run: python -m compileall custom_components/diva tests/custom_components/diva
      - name: Ruff
        run: ruff check custom_components/diva tests/custom_components/diva
      - name: Pytest
        run: pytest -q tests/custom_components/diva
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install frontend tooling
        run: npm ci
      - name: Frontend syntax
        run: npm run check
      - name: Build frontend bundle
        run: npm run build
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: diva-frontend
          path: |
            custom_components/diva/frontend/diva-editor-panel.js
