name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package and upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install frontend tooling
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Package HACS repository
        run: zip -r diva-hacs.zip custom_components README.md README.ru.md README.es.md CHANGELOG.md LICENSE hacs.json docs mkdocs.yml package.json
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            diva-hacs.zip
            custom_components/diva/frontend/diva-editor-panel.js
            README.md
            CHANGELOG.md
